<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>MindBalance+</title>

<style>
body {
margin: 0;
font-family: 'Segoe UI', sans-serif;
background: linear-gradient(to right, #eef2f3, #dfe9f3);
}

header {
background: #1e272e;
color: white;
padding: 15px;
text-align: center;
}

nav {
display: flex;
justify-content: center;
background: #2f3640;
}

nav button {
background: none;
border: none;
color: white;
padding: 15px 25px;
cursor: pointer;
}

nav button:hover {
background: #353b48;
}

.section {
display: none;
padding: 20px;
max-width: 900px;
margin: auto;
}

.active {
display: block;
}

.card {
background: white;
padding: 20px;
border-radius: 12px;
margin-top: 20px;
box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.answer {
display: block;
width: 100%;
margin: 10px 0;
padding: 12px;
border: none;
border-radius: 8px;
background: #0984e3;
color: white;
cursor: pointer;
}

.answer:hover {
background: #0652DD;
}

/* CHAT */
.chat-box {
height: 300px;
overflow-y: auto;
border: 1px solid #ddd;
padding: 10px;
border-radius: 10px;
background: #fafafa;
}

.message {
margin: 10px 0;
}

.user {
text-align: right;
color: #0984e3;
}

.bot {
text-align: left;
color: #2d3436;
}

input {
width: 75%;
padding: 10px;
margin-top: 10px;
}

.send {
padding: 10px;
background: #00b894;
color: white;
border: none;
border-radius: 5px;
}
</style>
</head>

<body>

<header>
<h1>MindBalance+</h1>
<p>Test • Bien-être • Soutien étudiant</p>
</header>

<nav>
<button onclick="show('test')">Test</button>
<button onclick="show('chat')">Chat</button>
<button onclick="show('help')">Aide</button>
</nav>

<!-- TEST -->
<div id="test" class="section active">
<div class="card">
<h2>Test de personnalité</h2>
<p id="q"></p>
<button class="answer" onclick="ans('A')" id="a"></button>
<button class="answer" onclick="ans('B')" id="b"></button>
</div>
</div>

<!-- CHAT -->
<div id="chat" class="section">
<div class="card">
<h2>Chat de soutien 💬</h2>
<div class="chat-box" id="chatBox"></div>
<input type="text" id="msg" placeholder="Parle ici...">
<button class="send" onclick="send()">Envoyer</button>
</div>
</div>

<!-- AIDE -->
<div id="help" class="section">
<div class="card">
<h2>Conseils</h2>
<ul>
<li>📚 Organise ton travail en petites tâches</li>
<li>⏸️ Fais des pauses</li>
<li>💬 Parle à quelqu’un de confiance</li>
</ul>

<p style="margin-top:20px;color:red;">
⚠️ Si tu te sens très mal, parle à un adulte ou un professionnel.
</p>
</div>
</div>

<script>
// NAV
function show(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

// TEST
let qs = [
{q:"Tu préfères :",A:"Voir du monde",B:"Être seul"},
{q:"Tu réfléchis :",A:"Rapidement",B:"Profondément"},
{q:"Tu es :",A:"Actif",B:"Calme"}
];

let i=0,aS=0,bS=0;

function load(){
if(i<qs.length){
q.innerText=qs[i].q;
a.innerText=qs[i].A;
b.innerText=qs[i].B;
}else{
let res;
if(aS>bS) res="Extraverti 🔥";
else if(bS>aS) res="Introverti 🌙";
else res="Ambiverti ⚖️";

document.querySelector("#test .card").innerHTML="<h2>"+res+"</h2>";
}
}

function ans(c){
if(c==="A") aS++; else bS++;
i++;
load();
}

load();

// CHAT
function send(){
let input=document.getElementById("msg");
let text=input.value;
if(!text) return;

addMsg(text,"user");

let reply="Je suis là pour t’écouter 💙";

if(text.includes("stress")) reply="Le stress est normal. Essaie de respirer profondément.";
if(text.includes("fatigue")) reply="Repose-toi, ton cerveau en a besoin.";
if(text.includes("triste")) reply="Tu n’es pas seul(e). Parler aide beaucoup.";

setTimeout(()=>addMsg(reply,"bot"),500);

input.value="";
}

function addMsg(txt,type){
let div=document.createElement("div");
div.className="message "+type;
div.innerText=txt;
document.getElementById("chatBox").appendChild(div);
}
</script>
Racha web SITE 
</body>
</html>
